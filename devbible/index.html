<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Development Bible · Eclipsed Realms</title>
<style>
  :root { color-scheme: dark; --gold: #c9a45c; --ink: #e9e2d4; --dim: #9a9387; --line: #2a2620; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 30%, #17130f 0%, #070605 70%); color: var(--ink); font: 17px/1.5 Georgia, 'Times New Roman', serif; }
  main { width: min(420px, 92vw); padding: 40px 34px; border: 1px solid var(--line); background: rgba(12, 10, 8, .82); text-align: center; }
  .eyebrow { letter-spacing: .28em; text-transform: uppercase; font-size: .72rem; color: var(--gold); margin: 0 0 10px; }
  h1 { font-weight: 400; font-size: 1.7rem; margin: 0 0 8px; }
  p { color: var(--dim); margin: 0 0 22px; font-size: .95rem; }
  input { width: 100%; padding: 12px 14px; background: #0d0b09; color: var(--ink); border: 1px solid #3a342b; font: inherit; letter-spacing: .12em; text-align: center; }
  input:focus { outline: 2px solid var(--gold); outline-offset: 2px; }
  button { margin-top: 14px; width: 100%; padding: 12px; background: var(--gold); color: #120e09; border: 0; font: inherit; letter-spacing: .14em; text-transform: uppercase; font-size: .82rem; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 1.4em; margin: 14px 0 0; color: #d98b6b; font-size: .9rem; }
  .row { display: flex; justify-content: space-between; margin-top: 22px; font-size: .82rem; }
  a, .link { color: var(--dim); background: none; border: 0; padding: 0; width: auto; margin: 0; text-transform: none; letter-spacing: 0; font: inherit; font-size: .82rem; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Eclipsed Realms</p>
  <h1>Development Bible</h1>
  <p>Enter the password to open the development Bible.</p>
  <form id="f" autocomplete="off">
    <label for="pw" class="eyebrow" style="display:block">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Open</button>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <div class="row"><a href="../">Back to the official site</a><button class="link" id="lock" type="button" hidden>Lock this browser</button></div>
</main>
<script src="gate.js"></script>
</body>
</html>
